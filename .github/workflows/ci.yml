name: CI and Railway deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    env:
      AGENT_API_KEY: ci-dummy-key
      REDIS_URL: fake://
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run local checkpoint tests
        run: python -m pytest tests/ -v -m "not docker" --ignore=tests/test_cp5.py

  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Measure original single-stage image
        run: |
          cat > "$RUNNER_TEMP/Dockerfile.single-stage" <<'EOF'
          FROM python:3.11
          WORKDIR /app
          COPY . .
          RUN pip install -r requirements.txt
          EXPOSE 8000
          CMD ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
          EOF
          docker build -f "$RUNNER_TEMP/Dockerfile.single-stage" -t day12-agent:single .
      - name: Build production multi-stage image
        run: docker build -t day12-agent:${{ github.sha }} .
      - name: Report image sizes
        run: |
          docker image inspect --format='{{.Size}}' day12-agent:single | awk '{printf "Single-stage reference: %.1f MiB\n", $1/1048576}'
          docker image inspect --format='{{.Size}}' day12-agent:${{ github.sha }} | awk '{printf "Multi-stage production: %.1f MiB\n", $1/1048576}'

  deploy:
    name: Deploy to Railway
    needs: [test, build]
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      vars.RAILWAY_PROJECT_ID != '' &&
      vars.RAILWAY_ENVIRONMENT_ID != '' &&
      vars.RAILWAY_SERVICE_ID != ''
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Railway CLI
        run: npm install --global @railway/cli
      - name: Link Railway project and service
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
          RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
        run: |
          test -n "$RAILWAY_TOKEN" || { echo "Missing RAILWAY_TOKEN secret"; exit 1; }
          test -n "$RAILWAY_PROJECT_ID" || { echo "Missing RAILWAY_PROJECT_ID variable"; exit 1; }
          test -n "$RAILWAY_ENVIRONMENT_ID" || { echo "Missing RAILWAY_ENVIRONMENT_ID variable"; exit 1; }
          test -n "$RAILWAY_SERVICE_ID" || { echo "Missing RAILWAY_SERVICE_ID variable"; exit 1; }
          railway link --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_ENVIRONMENT_ID" --service "$RAILWAY_SERVICE_ID" --json
          railway up --ci --service "$RAILWAY_SERVICE_ID"
      - name: Smoke test public service
        if: vars.PUBLIC_URL != ''
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
        run: |
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error "$PUBLIC_URL/health"; then
              exit 0
            fi
            sleep 10
          done
          echo "Railway deployment did not become healthy"
          exit 1
